name: PR Check

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: List changed files
        run: |
          echo "## Changed Files" >> $GITHUB_STEP_SUMMARY
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} >> $GITHUB_STEP_SUMMARY

      - name: Check JSON syntax
        run: |
          echo "### JSON Validation" >> $GITHUB_STEP_SUMMARY
          find . -name "*.json" -type f | while read f; do
            if jq empty "$f" 2>/dev/null; then
              echo "✅ $f" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ $f - Invalid JSON" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          done

      - name: Check shell scripts
        run: |
          echo "### Shell Scripts" >> $GITHUB_STEP_SUMMARY
          find . -name "*.sh" -type f | while read f; do
            if bash -n "$f" 2>/dev/null; then
              echo "✅ $f" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ $f - Syntax error" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          done

      - name: Summary
        run: echo "✅ All checks passed!" >> $GITHUB_STEP_SUMMARY
