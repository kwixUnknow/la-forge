<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Forge - Kanban Board</title>
    <style>
        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2a2a2a;
            --bg-tertiary: #1f1f1f;
            --text-primary: #e0e0e0;
            --text-secondary: #9ca3af;
            --text-tertiary: #6b7280;
            --border-primary: #333;
            --border-secondary: #3a3a3a;
            --accent-blue: #60a5fa;
            --accent-blue-hover: #3b82f6;
            --accent-blue-dark: #2563eb;
        }

        body.light-mode {
            --bg-primary: #f3f4f6;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f9fafb;
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --text-tertiary: #6b7280;
            --border-primary: #e5e7eb;
            --border-secondary: #d1d5db;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-blue-dark: #1d4ed8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-primary);
        }

        h1 {
            font-size: 28px;
            color: var(--accent-blue);
        }

        .agent-status {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 14px;
        }

        .agent-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--bg-secondary);
            border-radius: 6px;
        }

        .theme-toggle {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-secondary);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.2s;
        }

        .theme-toggle:hover {
            background: var(--bg-tertiary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
        }

        .status-dot.active {
            background: #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            margin-bottom: 20px;
        }

        button {
            background: var(--accent-blue-hover);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-blue-dark);
        }

        button.secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-secondary);
        }

        button.secondary:hover {
            background: var(--bg-tertiary);
        }

        .kanban-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .column {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 15px;
            min-height: 500px;
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-secondary);
        }

        .column-title {
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .column-count {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        .ticket {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-secondary);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: move;
            transition: all 0.2s;
        }

        .ticket:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .ticket.dragging {
            opacity: 0.5;
        }

        .ticket-id {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .ticket-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .ticket-description {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .ticket-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-tertiary);
        }

        .ticket-assignee {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .agent-avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 20px;
            color: var(--accent-blue);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        input, textarea, select {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-secondary);
            border-radius: 6px;
            padding: 10px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .drop-zone {
            min-height: 100px;
        }

        .drop-zone.drag-over {
            background: var(--bg-tertiary);
            border: 2px dashed var(--accent-blue);
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <header>
        <h1>🔨 La Forge - Kanban Board</h1>
        <div class="agent-status">
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark/light mode" id="themeToggle">
                🌙
            </button>
            <div class="agent-indicator">
                <span class="status-dot" id="systemStatus"></span>
                <span id="systemStatusText">System</span>
            </div>
        </div>
    </header>

    <div class="controls">
        <button onclick="openCreateTicketModal()">+ New Ticket</button>
        <button class="secondary" onclick="refreshBoard()">↻ Refresh</button>
    </div>

    <div class="kanban-board">
        <div class="column" data-status="backlog">
            <div class="column-header">
                <span class="column-title">Backlog</span>
                <span class="column-count" id="count-backlog">0</span>
            </div>
            <div class="drop-zone" id="zone-backlog"></div>
        </div>

        <div class="column" data-status="todo">
            <div class="column-header">
                <span class="column-title">To Do</span>
                <span class="column-count" id="count-todo">0</span>
            </div>
            <div class="drop-zone" id="zone-todo"></div>
        </div>

        <div class="column" data-status="in_progress">
            <div class="column-header">
                <span class="column-title">In Progress</span>
                <span class="column-count" id="count-in_progress">0</span>
            </div>
            <div class="drop-zone" id="zone-in_progress"></div>
        </div>

        <div class="column" data-status="review">
            <div class="column-header">
                <span class="column-title">Review</span>
                <span class="column-count" id="count-review">0</span>
            </div>
            <div class="drop-zone" id="zone-review"></div>
        </div>

        <div class="column" data-status="testing">
            <div class="column-header">
                <span class="column-title">Testing</span>
                <span class="column-count" id="count-testing">0</span>
            </div>
            <div class="drop-zone" id="zone-testing"></div>
        </div>

        <div class="column" data-status="done">
            <div class="column-header">
                <span class="column-title">Done</span>
                <span class="column-count" id="count-done">0</span>
            </div>
            <div class="drop-zone" id="zone-done"></div>
        </div>
    </div>

    <!-- Create/Edit Ticket Modal -->
    <div class="modal" id="ticketModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Create Ticket</h2>
                <button class="close-btn" onclick="closeTicketModal()">&times;</button>
            </div>
            <form id="ticketForm" onsubmit="saveTicket(event)">
                <input type="hidden" id="ticketId">

                <div class="form-group">
                    <label for="ticketTitle">Title*</label>
                    <input type="text" id="ticketTitle" required>
                </div>

                <div class="form-group">
                    <label for="ticketDescription">Description*</label>
                    <textarea id="ticketDescription" required></textarea>
                </div>

                <div class="form-group">
                    <label for="ticketStatus">Status</label>
                    <select id="ticketStatus">
                        <option value="backlog">Backlog</option>
                        <option value="todo">To Do</option>
                        <option value="in_progress">In Progress</option>
                        <option value="review">Review</option>
                        <option value="testing">Testing</option>
                        <option value="done">Done</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ticketAssignee">Assignee</label>
                    <select id="ticketAssignee">
                        <option value="">Unassigned</option>
                        <option value="developer">Developer</option>
                        <option value="code-reviewer">Code Reviewer</option>
                        <option value="qa-tester">QA Tester</option>
                        <option value="planner">Planner</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="button" class="secondary" onclick="closeTicketModal()">Cancel</button>
                    <button type="submit">Save Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
